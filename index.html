        // ===== 应用过滤 & 渲染（支持街道+品类联合高亮） =====
        function applyFilterAndRenderMap() {
            if (clusterer) {
                clusterer.setMap(null);
                clusterer = null;
            }
            markerList.forEach(item => item.marker.setMap(null));

            let visibleItems = markerList.filter(item => item.type === currentMode);
            if (currentSite !== 'all') {
                visibleItems = visibleItems.filter(item => item.site === currentSite);
            }
            visibleItems.forEach(item => item.marker.setMap(map));

            const highlightStreetName = filterStreet.trim();
            const highlightCategoryName = filterCategory.trim();
            visibleItems.forEach(item => {
                const contentDiv = item.marker.getContent();
                if (!contentDiv) return;
                const street = (item.geo.street || '').trim();
                const cat = getCategoryFromItem(item);
                let shouldHighlight = false;
                if (highlightStreetName && highlightCategoryName) {
                    if (street === highlightStreetName && cat === highlightCategoryName) shouldHighlight = true;
                } else if (highlightStreetName) {
                    if (street === highlightStreetName) shouldHighlight = true;
                } else if (highlightCategoryName) {
                    if (cat === highlightCategoryName) shouldHighlight = true;
                }
                if (shouldHighlight) {
                    contentDiv.classList.add('highlighted');
                } else {
                    contentDiv.classList.remove('highlighted');
                }
            });

            if (!filterStreet && !filterCategory && visibleItems.length > 10) {
                const markers = visibleItems.map(item => item.marker);
                AMap.plugin('AMap.MarkerClusterer', () => {
                    clusterer = new AMap.MarkerClusterer(map, markers, {
                        gridSize: 60,
                        renderClusterMarker: function(context) {
                            const count = context.count;
                            const marker = new AMap.Marker({
                                position: context.latLng,
                                label: {
                                    content: `<div style="background:#4b5563;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,0.3);">${count}</div>`,
                                    direction: 'center'
                                }
                            });
                            return marker;
                        }
                    });
                    clusterer.on('click', function(e) {
                        const cluster = e.cluster;
                        if (!cluster) return;
                        const markers = cluster.getMarkers();
                        if (markers.length === 0) return;
                        const items = markers.map(m => {
                            return markerList.find(item => item.marker === m);
                        }).filter(Boolean);
                        if (items.length === 0) return;
                        const content = `<div style="max-height:200px;overflow-y:auto;">
                            <b>聚合内 ${items.length} 个标记：</b><br>
                            ${items.map((item, idx) => `<div style="padding:2px 0;border-bottom:1px solid #eee;">${idx+1}. ${item.geo.name}（${getCategoryFromItem(item)}）</div>`).join('')}
                        </div>`;
                        const infoWin = new AMap.InfoWindow({
                            content: content,
                            offset: new AMap.Pixel(0, -20)
                        });
                        infoWin.open(map, cluster.getCenter());
                    });
                });
            }
            updateModeMarkerCount();
            updateIdentifiedStreetCount();
            updateCategoryTags();

            if (filterStreet && filterCategory) {
                autoOpenMarkersInfoWindow();
            } else {
                autoOpenedInfoWindows.forEach(win => win.close());
                autoOpenedInfoWindows = [];
            }
        }

        // ===== 搜索（备注/品类） =====
        function searchExistNoteMarker() {
            const keywordInput = document.getElementById("noteSearchInput").value.trim().toLowerCase();
            const boxDom = document.getElementById("noteSearchResultBox");
            if (!keywordInput) {
                boxDom.innerText = "请输入品类/师傅名";
                return;
            }
            if (lastHighlightMarker) {
                lastHighlightMarker.setIcon(ICON_NORMAL);
                lastHighlightMarker = null;
            }
            autoOpenedInfoWindows.forEach(win => win.close());
            autoOpenedInfoWindows = [];

            const hitList = [];
            markerList.forEach((item, idx) => {
                if (item.type !== currentMode) return;
                if (currentSite !== 'all' && item.site !== currentSite) return;
                if (filterStreet) {
                    const s = (item.geo.street || '').trim();
                    if (s !== filterStreet) return;
                }
                if (filterCategory) {
                    const cat = getCategoryFromItem(item);
                    if (cat !== filterCategory) return;
                }
                const nameStr = (item.geo.name || "").toLowerCase();
                const noteStr = (item.note || "").toLowerCase();
                const categoryStr = getCategoryFromItem(item).toLowerCase();
                const noteKeys = noteStr.split(/[,，、\s]+/).map(k => k.trim()).filter(k => k.length > 0);
                let isMatch = false;
                if (nameStr.includes(keywordInput) || categoryStr.includes(keywordInput)) isMatch = true;
                else {
                    for (let nk of noteKeys) {
                        if (nk.includes(keywordInput) || keywordInput.includes(nk)) { isMatch = true; break; }
                    }
                }
                if (isMatch) hitList.push({ idx, item });
            });

            if (hitList.length === 0) {
                let msg = `未找到匹配「${keywordInput}」`;
                if (filterStreet) msg += `（街道：${filterStreet}）`;
                if (filterCategory) msg += `（品类：${filterCategory}）`;
                boxDom.innerText = msg;
                return;
            }

            boxDom.innerHTML = `<div>共 ${hitList.length} 条，点击定位</div>`;
            hitList.forEach(hit => {
                const div = document.createElement("div");
                div.className = "result-item";
                div.innerText = `[${hit.idx+1}] ${hit.item.geo.name} ｜ ${hit.item.note || "无"}`;
                div.dataset.index = hit.idx;
                div.onclick = function() {
                    document.querySelectorAll('#noteSearchResultBox .result-item').forEach(el => el.classList
                        .remove('active'));
                    this.classList.add('active');
                    this.scrollIntoView({ block: 'center', behavior: 'smooth' });

                    if (lastHighlightMarker) lastHighlightMarker.setIcon(ICON_NORMAL);
                    const contentDiv = hit.item.marker.getContent();
                    if (contentDiv) {
                        contentDiv.style.border = '3px solid #9ca3af';
                        contentDiv.style.boxShadow = '0 0 12px rgba(156,163,175,0.8)';
                    }
                    if (lastHighlightMarker && lastHighlightMarker !== hit.item.marker) {
                        const oldDiv = lastHighlightMarker.getContent();
                        if (oldDiv) {
                            oldDiv.style.border = '2px solid #fff';
                            oldDiv.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
                        }
                    }
                    lastHighlightMarker = hit.item.marker;
                    const pos = hit.item.marker.getPosition();
                    map.setZoomAndCenter(16, pos);
                    hit.item.infoWin.open(map, pos);
                    autoOpenedInfoWindows.forEach(win => win.close());
                    autoOpenedInfoWindows = [];
                };
                boxDom.appendChild(div);
            });
        }

        function selectStreetForAdd(streetName, polygon) {

            if (!polygon) {
                for (let p of streetPolygons) {
                    if (p._streetName === streetName) {
                        polygon = p;
                        break;
                    }
                }
            }
            if (!polygon) {
                showToast('未找到对应的街道多边形，请重试', 'error');
                return;
            }
            selectedStreetForAdd = streetName;
            highlightedPolygon = polygon;
            highlightedPolygonOrigOpts = {
                fillOpacity: polygon.getOptions().fillOpacity || 0.14,
                strokeWeight: polygon.getOptions().strokeWeight || 2,
                strokeColor: polygon.getOptions().strokeColor || '#6b7280'
            };
            polygon.setOptions({
                fillOpacity: 0.45,
                strokeWeight: 5,
                strokeColor: '#4b5563',
                strokeStyle: 'solid'
            });

        function clearSelectedStreet() {
            if (highlightedPolygon) {
                const opts = highlightedPolygonOrigOpts || { fillOpacity: 0.14, strokeWeight: 2 };
                highlightedPolygon.setOptions({
                    fillOpacity: opts.fillOpacity,
                    strokeWeight: opts.strokeWeight,
                    strokeColor: opts.strokeColor || '#6b7280',
                    strokeStyle: 'solid'
                });
                highlightedPolygon = null;
                highlightedPolygonOrigOpts = null;
            }
            selectedStreetForAdd = null;
            if (isAddMarkerMode) {
                const statusEl = document.getElementById('addModeStatus');
                statusEl.innerHTML = '🎯 点击街道选中 → 再次点击同一街道放置标记';

                tempClickMarker = null; }

        function handleMapClickForAdd(lng, lat, streetName) {
            if (!streetName) {
                showToast('请先点击街道选择目标区域', 'error');
                return;
            }
            if (tempClickMarker) tempClickMarker.remove();
            const contentDiv = document.createElement('div');
            contentDiv.className = 'temp-marker';
            contentDiv.style.width = '20px';
            contentDiv.style.height = '20px';
            contentDiv.style.background = 'rgba(160,160,160,0.4)';
            contentDiv.style.border = '2px solid #6b7280';
            contentDiv.style.borderRadius = '50%';
            contentDiv.style.pointerEvents = 'none';
            tempClickMarker = new AMap.Marker({
                position: [lng, lat],
                content: contentDiv,
                offset: new AMap.Pixel(-10, -10),
                map: map
            });
            setTimeout(() => {
                if (tempClickMarker && document.getElementById('editModal').style.display !== 'flex') {
                    tempClickMarker.remove();
                    tempClickMarker = null;
                }
            }, 2000);
            openAddMarkerModal(lng, lat, streetName);
        }

        // ===== 自动补全街道 =====
        async function autoFillStreetForMarkers() {
            let updatedCount = 0;
            for (let item of markerList) {
                if (!item.geo.street) {
                    const pos = item.marker.getPosition();
                    const streetName = findStreetByLngLat(pos.getLng(), pos.getLat());
                    if (streetName) {
                        item.geo.street = streetName;
                        if (item.id) {
                            try {
                                const promise = supabaseClient.from(TABLE_NAME).update({
                                    geo: item.geo
                                }).match({ id: item.id });
                                await supabaseFetchWithTimeout(() => promise);
                                updatedCount++;
                            } catch (err) {
                                console.error('更新街道失败', err);
                            }
                        }
                    }
                }
            }
            if (updatedCount > 0) {
                console.log(`✅ 自动补全了 ${updatedCount} 个标记的街道信息`);
                applyFilterAndRenderMap();
                updateMarkerCountBadge();
                updateCategoryTags();
            }
        }

        // ===== Excel 导入 =====
        function handleExcelImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            pendingExcelData = null;
            document.getElementById('progressArea').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressBar').className = 'progress-bar';
            document.getElementById('progressText').textContent = '等待开始…';
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const binary = ev.target.result;
                    const workbook = XLSX.read(binary, { type: 'binary' });
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(sheet);
                    if (!jsonRows || jsonRows.length === 0) {
                        showToast('Excel为空', 'error');
                        e.target.value = '';
                        document.getElementById('fileStatusRow').style.display = 'none';
                        return;
                    }
                    pendingExcelData = jsonRows;
                    document.getElementById('selectedFileName').textContent = `📄 ${file.name} (${jsonRows.length}行)`;
                    document.getElementById('fileStatusRow').style.display = 'flex';
                    document.getElementById('btnStartRecognize').disabled = false;
                    document.getElementById('btnStartRecognize').textContent = '▶ 识别';
                    document.getElementById('progressArea').style.display = 'none';
                    showToast(`已加载 ${jsonRows.length} 行数据，点击「识别」开始处理`, 'info');
                } catch (err) {
                    showToast('解析Excel失败：' + err.message, 'error');
                    e.target.value = '';
                    document.getElementById('fileStatusRow').style.display = 'none';
                }
            };
            reader.readAsBinaryString(file);
        }

        function cancelPendingFile() {
            pendingExcelData = null;
            document.getElementById('fileStatusRow').style.display = 'none';
            document.getElementById('excelFileInput').value = '';
            document.getElementById('progressArea').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressBar').className = 'progress-bar';
            document.getElementById('progressText').textContent = '已取消';
            showToast('已取消导入', 'info');
        }

        async function startExcelRecognition() {
            if (isProcessing) {
                showToast('正在处理中，请稍候…', 'info');
                return;
            }
            if (!pendingExcelData || pendingExcelData.length === 0) {
                showToast('请先上传Excel文件', 'error');
                return;
            }
            if (Object.keys(streetCenterCache).length === 0) {
                showToast('请先切换站点加载街道数据，否则无法准确识别位置', 'error');
                return;
            }
            const btn = document.getElementById('btnStartRecognize');
            btn.disabled = true;
            btn.textContent = '⏳ 处理中…';
            isProcessing = true;
            const progressArea = document.getElementById('progressArea');
            progressArea.style.display = 'block';
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.className = 'progress-bar';
            const progressText = document.getElementById('progressText');
            try {
                const totalRows = pendingExcelData.length;
                progressText.textContent = `📊 共 ${totalRows} 行`;
                const result = await processExcelRowsWithProgress(pendingExcelData, (progress) => {
                    const pct = Math.min(progress.percent || 0, 100);
                    progressBar.style.width = pct + '%';
                    let statusText = progress.status || '处理中…';
                    let detail = '';
                    if (progress.current !== undefined && progress.total !== undefined) {
                        detail = ` (${progress.current}/${progress.total})`;
                    }
                    if (progress.street) {
                        detail += ` 街道：${progress.street}`;
                    }
                    if (progress.count !== undefined) {
                        detail += ` 已生成/更新 ${progress.count} 个`;
                    }
                    progressText.textContent = `${statusText}${detail}`;
                    if (progress.done) {
                        progressBar.className = 'progress-bar done';
                        progressText.textContent = `✅ 完成！共 ${progress.count || 0} 个标记`;
                    }
                });
                progressBar.style.width = '100%';
                progressBar.className = 'progress-bar done';
                progressText.textContent = `✅ 完成！共 ${result?.count || 0} 个标记`;
                updateMarkerCountBadge();
                updateCategoryTags();
                showToast(`Excel 识别完成！共生成/更新 ${result?.count || 0} 个标记`);
            } catch (err) {
                console.error('识别失败:', err);
                progressText.textContent = `❌ 失败：${err.message}`;
                showToast('识别失败：' + err.message, 'error');
            } finally {
                isProcessing = false;
                btn.disabled = false;
                btn.textContent = '▶ 识别';
            }
        }

        // ===== 核心处理（Excel导入） =====
        async function processExcelRowsWithProgress(rows, onProgress) {
            if (!rows || rows.length === 0) {
                onProgress && onProgress({ status: '❌ 无数据', done: true, count: 0 });
                return { count: 0 };
            }

            function cleanStreetName(name) {
                if (!name) return '';
                name = name.trim();
                if (name.includes('街道') && !name.endsWith('街道')) name = name.replace(/街道/g, '').trim() + '街道';
                if (!name.endsWith('街道') && !name.includes('街道')) name = name + '街道';
                return name;
            }

            let site = currentSite === 'all' ? 'lianhu' : currentSite;
            const groupMap = {};
            for (let row of rows) {
                let street = (row["街道"] || "").trim();
                const category = (row["品类"] || "").trim();
                if (!street || !category) continue;
                const rawStreet = street;
                street = cleanStreetName(street);
                const nameList = [];
                Object.keys(row).forEach(key => {
                    if (key.startsWith("姓名")) {
                        const val = (row[key] || "").trim();
                        if (val) nameList.push(val);
                    }
                });
                if (nameList.length === 0) continue;
                const groupKey = `${street}||${category}||${currentMode}||${site}`;
                if (!groupMap[groupKey]) {
                    groupMap[groupKey] = { street, rawStreet, category, nameList, type: currentMode, site: site };
                }
                nameList.forEach(name => {
                    if (!groupMap[groupKey].nameList.includes(name)) groupMap[groupKey].nameList.push(name);
                });
            }
            const groupKeys = Object.keys(groupMap);
            if (groupKeys.length === 0) {
                onProgress && onProgress({ status: '⚠️ 没有有效分组', done: true, count: 0 });
                showToast('没有有效分组，请检查Excel格式', 'error');
                return { count: 0 };
            }
            onProgress && onProgress({
                status: `📦 分组完成，共 ${groupKeys.length} 组`,
                total: groupKeys.length,
                current: 0,
                percent: 0,
                count: 0
            });
            const unmatchedStreets = new Set();
            let geocodeSuccessCount = 0;
            const totalGroups = groupKeys.length;
            for (let i = 0; i < groupKeys.length; i++) {
                const gk = groupKeys[i];
                const gItem = groupMap[gk];
                const pct = Math.round((i / totalGroups) * 30);
                onProgress && onProgress({
                    status: `🌐 坐标解析 ${i+1}/${totalGroups}`,
                    total: totalGroups,
                    current: i + 1,
                    percent: pct,
                    street: gItem.street,
                    count: 0
                });
                if (streetCenterCache[gItem.street]) continue;
                const fuzzyKey = Object.keys(streetCenterCache).find(key =>
                    key.includes(gItem.street.replace('街道', '')) || gItem.street.includes(key.replace('街道', ''))
                );
                if (fuzzyKey) {
                    gItem.street = fuzzyKey;
                    continue;
                }
                const fullAddress = `西安市${gItem.street}`;
                const geo = await geocodeAmap(fullAddress);
                if (geo) {
                    streetCenterCache[gItem.street] = { lng: geo.lng, lat: geo.lat };
                    geocodeSuccessCount++;
                } else {
                    unmatchedStreets.add(gItem.rawStreet || gItem.street);
                }
                await sleep(150);
            }
            if (unmatchedStreets.size > 0) {
                const toRemove = [];
                for (let gk of groupKeys) {
                    const street = groupMap[gk].street;
                    if (unmatchedStreets.has(street) || !streetCenterCache[street]) toRemove.push(gk);
                }
                toRemove.forEach(gk => delete groupMap[gk]);
                const msg = `⚠️ 以下 ${unmatchedStreets.size} 个街道无法获取坐标，已跳过：${[...unmatchedStreets].join('、')}`;
                onProgress && onProgress({
                    status: msg,
                    total: groupKeys.length,
                    current: groupKeys.length,
                    percent: 30,
                    count: 0
                });
            }
            const validGroupKeys = Object.keys(groupMap);
            if (validGroupKeys.length === 0) {
                onProgress && onProgress({ status: '❌ 没有有效街道', done: true, count: 0 });
                showToast('没有有效街道，请检查数据', 'error');
                return { count: 0 };
            }
            onProgress && onProgress({
                status: `✅ 坐标解析完成，有效 ${validGroupKeys.length} 组`,
                total: validGroupKeys.length,
                current: 0,
                percent: 30,
                count: 0
            });
            const streetTotalCount = {};
            for (let gk of validGroupKeys) {
                const street = groupMap[gk].street;
                streetTotalCount[street] = (streetTotalCount[street] || 0) + 1;
            }
            const streetOffsetCounter = {};
            let successCount = 0;
            const totalValid = validGroupKeys.length;
            for (let i = 0; i < validGroupKeys.length; i++) {
                const gk = validGroupKeys[i];
                const gItem = groupMap[gk];
                const street = gItem.street;
                const cat = gItem.category;
                const masterNames = gItem.nameList.join("，");
                const type = gItem.type || currentMode;
                const site = gItem.site || 'lianhu';
                const center = streetCenterCache[street];
                if (!center) continue;
                const total = streetTotalCount[street];
                const idx = streetOffsetCounter[street] || 0;
                streetOffsetCounter[street] = idx + 1;
                const angle = (idx / total) * 2 * Math.PI;
                const radius = 0.0015 + Math.min(total * 0.0003, 0.002);
                const lngOffset = radius * Math.cos(angle);
                const latOffset = radius * Math.sin(angle);
                const baseGeo = {
                    name: `${street}｜${cat}`,
                    address: street,
                    lng: center.lng + lngOffset,
                    lat: center.lat + latOffset,
                    province: "陕西省",
                    city: "西安市",
                    district: "",
                    street: street,
                    category: cat
                };
                const note = masterNames;
                const now = new Date().toISOString();
                const pct = 30 + Math.round((i / totalValid) * 70);
                onProgress && onProgress({
                    status: `💾 保存/更新 ${i+1}/${totalValid}`,
                    total: totalValid,
                    current: i + 1,
                    percent: pct,
                    street: street,
                    count: successCount
                });
                const existingItem = markerList.find(item => item.geo.name === baseGeo.name && item.type === type &&
                    item.site === site);
                if (existingItem) {
                    try {
                        existingItem.geo = { ...baseGeo };
                        existingItem.note = note;
                        existingItem.updated_at = now;
                        existingItem.marker.setPosition([baseGeo.lng, baseGeo.lat]);
                        updateMarkerIcon(existingItem);
                        const idx = markerList.indexOf(existingItem);
                        refreshMarkerInfoWindow(existingItem, idx);
                        const promise = supabaseClient.from(TABLE_NAME).update({
                            geo: existingItem.geo,
                            note: existingItem.note,
                            updated_at: now,
                            type: type,
                            site: site
                        }).match({ id: existingItem.id });
                        const { error } = await supabaseFetchWithTimeout(() => promise);
                        if (error) {
                            console.error('更新标记失败，详细错误:', error);
                            throw error;
                        }
                        successCount++;
                    } catch (err) {
                        console.error('更新标记失败：', err);
                    }
                } else {
                    try {
                        const promise = supabaseClient.from(TABLE_NAME).insert([{
                            geo: baseGeo,
                            note: note,
                            created_at: now,
                            updated_at: now,
                            type: type,
                            site: site
                        }]).select();
                        const { data, error } = await supabaseFetchWithTimeout(() => promise);
                        if (error) {
                            console.error('插入新标记失败，详细错误:', error);
                            if (error.details) console.error('细节:', error.details);
                            if (error.hint) console.error('提示:', error.hint);
                            throw error;
                        }
                        if (data && data.length > 0) {
                            const newDoc = data[0];
                            const item = createMarkerItem(newDoc.geo, newDoc.note, newDoc.id, newDoc.created_at,
                                newDoc.updated_at, newDoc.type || type, newDoc.site || site);
                            markerList.push(item);
                            successCount++;
                        }
                    } catch (err) {
                        console.error('插入新标记失败：', err);
                    }
                }
                await sleep(30);
            }
            markerList.forEach((item, idx) => {
                refreshMarkerInfoWindow(item, idx);
                updateMarkerIcon(item);
            });
            applyFilterAndRenderMap();
            updateMarkerCountBadge();
            onProgress && onProgress({
                status: `✅ 完成`,
                done: true,
                count: successCount,
                percent: 100
            });
            return { count: successCount };
        }

        function geocodeAmap(address) {
            return new Promise(resolve => {
                AMap.plugin("AMap.Geocoder", () => {
                    const geocoder = new AMap.Geocoder();
                    geocoder.getLocation(address, function(status, res) {
                        if (status === "complete" && res.geocodes.length > 0) {
                            const g = res.geocodes[0];
                            resolve({ lng: g.location.lng, lat: g.location.lat });
                        } else resolve(null);
                    });
                });
            });
        }

        // ===== Realtime 订阅 =====
        let subscription = null;

        function setupRealtimeSubscription() {
            if (subscription) { subscription.unsubscribe();
                subscription = null; }
            subscription = supabaseClient
                .channel('public:markers')
                .on('postgres_changes', { event: '*', schema: 'public', table: TABLE_NAME }, payload => {
                    console.log('🔄 数据库变更，重新加载数据', payload);
                    loadFromCloud();
                })
                .subscribe((status) => { console.log('📡 Realtime 订阅状态:', status); });
        }

        // ===== 快捷键 =====
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'Z') {
                e.preventDefault();
                loadFromCloud();
            }
            if (e.key === 'Escape') {
                if (document.getElementById('editModal').style.display === 'flex') {
                    closeEditModal();
                    return;
                }
                if (document.getElementById('mergeModal').style.display === 'flex') {
                    document.getElementById('mergeModal').style.display = 'none';
                    if (pendingMergeReject) pendingMergeReject('cancel');
                    pendingMergeResolve = null;
                    return;
                }
                if (document.getElementById('recycle-modal').style.display === 'flex') {
                    closeRecycleBin();
                    return;
                }
                if (isAddMarkerMode && selectedStreetForAdd) {
                    clearSelectedStreet();
                    const statusEl = document.getElementById('addModeStatus');
                    statusEl.innerHTML = '🎯 已取消选中，请重新点击街道选择目标';
                    showToast('已取消街道选中', 'info');
                    return;
                }
                if (isAddMarkerMode) {
                    cancelAddMarkerMode();
                    return;
                }
                if (tempLocationMarker) {
                    clearTempLocationMarker();
                    showToast('已清除定位标记', 'info');
                    return;
                }
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                if (document.getElementById('editModal').style.display === 'flex') {
                    saveMarkerEdit();
                }
            }
        });

        // ===== 折叠面板 =====
        function toggleSection(header) {
            const body = header.nextElementSibling;
            if (body) {
                body.classList.toggle('hidden');
                header.classList.toggle('open');
            }
        }

        // ===== 初始化 =====
        window.onload = function() {
            loadRecycleFromStorage();

            map = new AMap.Map("map", {
                zoom: 10,
                center: [108.95, 34.27],
                features: ['bg', 'road', 'point', 'building']
            });

            document.getElementById("excelFileInput").addEventListener("change", handleExcelImport);

            document.getElementById('siteAllBtn').className = 'primary small';
            document.getElementById('siteLianhuBtn').className = 'outline small';
            document.getElementById('siteWeiyangBtn').className = 'outline small';
            document.getElementById('siteYantaBtn').className = 'outline small';
            document.getElementById('currentSiteLabel').textContent = '全部';

            loadFromCloud().then(() => {
                setupRealtimeSubscription();
                loadStreetsForCurrentSite(currentSite, loadVersion);
            });

            setMode('repair');
            document.getElementById('modeIndicator').className = 'mode-indicator off';
            updateRecycleBadge();
            updateCategoryTags();

            console.log('✅ 应用初始化完成（精简控制板，3面板，模式·站点默认展开）');
            console.log('📌 提示：输入地址点击「解析定位」显示蓝色脉冲环，点击标记或按Esc清除。');
        };
    </script>
