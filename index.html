        "doumen.geojson": "斗门街道",
        "wangsi.geojson": "王寺街道",
        "mawang.geojson": "马王街道",
        "zhangjiacun.geojson": "张家村街道",

    };

    // ★★★ 手动覆盖街道标签位置（新增“土门街道”） ★★★
    const manualCenterOverride = {
        "建章路街道": { lng: 108.8192, lat: 34.3369 },
        "六村堡街道": { lng: 108.8532, lat: 34.3521 },
        "土门街道": { lng: 108.8780, lat: 34.2628 }
    };

    // ===== 坐标转换 =====
    const PI = 3.1415926535897932384626;
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }
    function transformLng(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
        return ret;
    }
    function wgs84ToGcj02(wgsLng, wgsLat) {
        let dLat = transformLat(wgsLng - 105.0, wgsLat - 35.0);
        let dLng = transformLng(wgsLng - 105.0, wgsLat - 35.0);
        let radLat = wgsLat / 180.0 * PI;
        let magic = Math.sin(radLat);
        magic = 1 - ee * magic * magic;
        let sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * PI);
        dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * PI);
        return [wgsLng + dLng, wgsLat + dLat];
    }
    function convertGeoCoordArray(coords) {
        if (typeof coords[0] === 'number' && typeof coords[1] === 'number') {
            return wgs84ToGcj02(coords[0], coords[1]);
        }
        const out = [];
        for (let i = 0; i < coords.length; i++) {
            out.push(convertGeoCoordArray(coords[i]));
        }
        return out;
    }

    // ===== 工具 =====
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function getRandomStreetColor() {
        const hue = Math.floor(Math.random() * 360);
        return { strokeColor: `hsl(${hue},75%,40%)`, fillColor: `hsl(${hue},70%,60%)` };
    }
    function supabaseFetchWithTimeout(promiseFn, timeoutMs = REQUEST_TIMEOUT) {
        return new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
                reject(new Error(`请求超时（${timeoutMs/1000}秒），请检查网络或稍后重试`));
            }, timeoutMs);
            promiseFn()
                .then(result => { clearTimeout(timer); resolve(result); })
                .catch(err => { clearTimeout(timer); reject(err); });
        });
    }
    function formatTimestamp(isoStr) {
        if (!isoStr) return '无';
        try {
            const d = new Date(isoStr);
            return d.toLocaleString('zh-CN', { hour12: false });
        } catch { return isoStr; }
    }

    // ===== 地图基础 =====
    function setCityXiAn() {
        map.setCity("西安市");

        map.setZoom(11);
    }
    function toggleSimpleMap() {

        document.getElementById("toggleSimpleBtn").innerText = "极简";
    }

    // ===== 加载大区 =====
    function renderDistrictGeoJson(geoData, distName) {
        let features = [];
        if (geoData.type === "Feature") features = [geoData];
        else if (geoData.type === "FeatureCollection") features = geoData.features;
        if (!features.length) return;
        features.forEach(feat => {
            if (!feat.geometry) return;
            let gcjCoords = feat.geometry.coordinates;
            let geoType = feat.geometry.type;
            let paths = [];
            if (geoType === "Polygon") paths.push(gcjCoords[0]);
            else if (geoType === "MultiPolygon") gcjCoords.forEach(poly => paths.push(poly[0]));
            paths.forEach(path => {
                const poly = new AMap.Polygon({
                    path: path,
                    strokeColor: "#c82423",
                    strokeWeight: 3,
                    fillColor: "#ff7777",
                    fillOpacity: 0.07,
                    zIndex: 4
                });
                poly.setMap(map);
                bigDistrictPolygons.push(poly);
            });
            let labelPositionArr;
            if (distName === "长安区") {
                labelPositionArr = [108.8762, 34.1452];
            } else {
                const tempPoly = new AMap.Polygon({ path: paths[0] });
                const bounds = tempPoly.getBounds();
                const bc = bounds.getCenter();
                labelPositionArr = [bc.getLng(), bc.getLat()];
            }
            const textLabel = new AMap.Text({
                text: distName,

    async function loadAllStreetGeoJson() {
        clearStreetLayer();
        streetCenterCache = {};
        let successCount = 0;

        for (let filename of streetJsonFileList) {
            try {
                const resp = await fetch("./geojson/" + filename);
                if (!resp.ok) throw new Error("http错误 " + resp.status);
                const geoData = await resp.json();
                let features = [];
                let showName = streetFileToName[filename] || filename.replace(".geojson", "");
                if (geoData.type === "Feature") features = [geoData];
                else if (geoData.type === "FeatureCollection") features = geoData.features;
                else { console.warn(`${filename} 未知geojson类型，跳过`); continue; }
                if (!Array.isArray(features) || features.length === 0) { console.warn(`${filename} 没有有效的features，跳过`); continue; }

                const polyList = [];
                features.forEach((feat, index) => {
                    if (!feat.geometry) { console.warn(` ${filename} 第${index}个特征无geometry`); return; }
                    if (feat.properties?.乡镇名) { showName = feat.properties.乡镇名; }
                    const geoType = feat.geometry.type;
                    const coords = feat.geometry.coordinates;
                    if (geoType === "Polygon") {
                        if (Array.isArray(coords) && Array.isArray(coords[0]) && coords[0].length > 2) {
                            polyList.push(coords[0]);
                        } else { console.warn(` ${filename} Polygon 外环格式异常`); }
                    } else if (geoType === "MultiPolygon") {
                        coords.forEach((polygonRings, idx) => {
                            if (Array.isArray(polygonRings) && Array.isArray(polygonRings[0]) && polygonRings[0].length > 2) {
                                polyList.push(polygonRings[0]);
                            } else { console.warn(` ${filename} MultiPolygon 第${idx}个碎片外环格式异常`); }
                        });
                    } else { console.warn(` ${filename} 未知几何类型: ${geoType}`); }
                });

                const validPolyList = polyList.filter(p => Array.isArray(p) && p.length > 2);
                if (validPolyList.length === 0) { console.warn(`⚠ 街道[${showName}] 没有有效多边形，跳过此街道`); continue; }

                validPolyList.forEach(pathArr => renderPolygonOnly(pathArr, showName));

                let sumLng = 0, sumLat = 0, totalPoints = 0;
                validPolyList.forEach(path => {
                    path.forEach(point => {
                        if (Array.isArray(point) && point.length >= 2 && !isNaN(point[0]) && !isNaN(point[1])) {
                            sumLng += point[0]; sumLat += point[1]; totalPoints++;
                        }
                    });
                });
                if (totalPoints === 0) { console.warn(`⚠ 街道[${showName}] 无有效顶点，跳过`); continue; }

                let useLng = sumLng / totalPoints;
                let useLat = sumLat / totalPoints;

                // ★★★ 应用手动覆盖（包含土门街道） ★★★
                const override = manualCenterOverride[showName];
                if (override) {
                    useLng = override.lng;
                    useLat = override.lat;
                } else {
                    const inXiAn = (lng, lat) => lng > 108.5 && lng < 109.5 && lat > 33.8 && lat < 34.8;
                    if (!inXiAn(useLng, useLat)) {
                        let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
                        validPolyList.forEach(path => {
                            path.forEach(point => {
                                if (Array.isArray(point) && point.length >= 2 && !isNaN(point[0]) && !isNaN(point[1])) {
                                    const lng = point[0], lat = point[1];
                                    if (lng < minLng) minLng = lng;
                                    if (lng > maxLng) maxLng = lng;
                                    if (lat < minLat) minLat = lat;
                                    if (lat > maxLat) maxLat = lat;
                                }
                            });
                        });
                        if (isFinite(minLng) && isFinite(maxLng) && isFinite(minLat) && isFinite(maxLat)) {
                            useLng = (minLng + maxLng) / 2;
                            useLat = (minLat + maxLat) / 2;
                        } else { console.warn(`⚠ 街道[${showName}] 包围盒计算失败，跳过`); continue; }
                    }
                }
                if (isNaN(useLng) || isNaN(useLat) || !isFinite(useLng) || !isFinite(useLat)) {
                    console.warn(`⚠ 街道[${showName}] 最终坐标无效，跳过`); continue;
                }

                const stdName = showName.trim();
                streetCenterCache[stdName] = { lng: useLng, lat: useLat };

                const streetMarkerLabel = new AMap.Marker({
                    position: [useLng, useLat],
                    icon: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMSIgaGVpZ2h0PSIxIj48L3N2Zz4=",
                    offset: new AMap.Pixel(0, 0),
                    zIndex: 25,
                    label: {
                        content: showName,
                        direction: "center",
                        offset: new AMap.Pixel(0, 0),
                        style: {
                            fontSize: "11px",
                            color: "#002266",
                            backgroundColor: "rgba(255,255,255,0.86)",
                            padding: "1px 5px",
                            border: "none",
                            fontWeight: "bold"
                        }
                    }
                });
                streetMarkerLabel.setMap(map);
                streetTextMarkers.push(streetMarkerLabel);
                successCount++;
            } catch (err) {
                console.error(`❌加载文件失败：${filename}`, err);
            }
            await sleep(100);
        }
        alert(`街道加载完成：成功${successCount}/${streetJsonFileList.length}`);
        if (streetPolygons.length > 0) map.setFitView(streetPolygons);
    }

                    gridSize: 60,

    function universalSearch() {
        const keyword = document.getElementById("addressInput").value.trim();
        const detailDom = document.getElementById("detailBox");
        const listDom = document.getElementById("resultList");
        listDom.innerHTML = "";
        if (!keyword) { alert("请输入地点/街道名称"); return; }

        const matchStreetName = Object.keys(streetCenterCache).find(name => name.includes(keyword) || keyword.includes(name));
        if (matchStreetName) {
            const center = streetCenterCache[matchStreetName];
            currentGeo = {
                type: "street",
                name: matchStreetName,
                address: matchStreetName,
                lng: center.lng,
                lat: center.lat,
                province: "陕西省",
                city: "西安市",
                district: "",
                street: matchStreetName
            };
            map.setCenter([center.lng, center.lat]);
            map.setZoom(13);
            if (tempSelectMarker) tempSelectMarker.remove();
            tempSelectMarker = new AMap.Marker({
                position: [center.lng, center.lat],
                icon: ICON_HIGHLIGHT,
                map: map
            });
            detailDom.innerText = `【街道定位】${matchStreetName}  (${center.lng.toFixed(4)},${center.lat.toFixed(4)})`;
            setFilterStreet(matchStreetName);
            return;
        }

        detailDom.innerText = "正在搜索...";
        AMap.plugin(['AMap.PlaceSearch', 'AMap.Geocoder'], function() {
            const placeSearch = new AMap.PlaceSearch({ city: "西安市", citylimit: true, pageSize: 6 });
            const geocoder = new AMap.Geocoder();

            placeSearch.search(keyword, function(statusPoi, resPoi) {
                let allResult = [];
                if (statusPoi === "complete" && resPoi.poiList && resPoi.poiList.pois.length > 0) {
                    resPoi.poiList.pois.forEach(p => {
                        allResult.push({
                            type: "poi",
                            name: p.name,
                            address: p.address,
                            lng: p.location.lng,
                            lat: p.location.lat,
                            province: p.pname,
                            city: p.cityname,
                            district: p.adname,
                            street: p.address
                        });
                    });
                }

                geocoder.getLocation(keyword, function(statusGeo, resGeo) {
                    if (statusGeo === "complete" && resGeo.geocodes.length > 0) {
                        resGeo.geocodes.forEach(g => {
                            allResult.push({
                                type: "geo",
                                name: g.formattedAddress,
                                address: g.formattedAddress,
                                lng: g.location.lng,
                                lat: g.location.lat,
                                province: g.province,
                                city: g.city,
                                district: g.district,
                                street: g.street
                            });
                        });
                    }

                    const DIST_THRESHOLD_M = 150;
                    function calcDistance(lng1, lat1, lng2, lat2) {
                        const R = 6371000;
                        const rad = Math.PI / 180;
                        const dLat = (lat2 - lat1) * rad;
                        const dLng = (lng2 - lng1) * rad;
                        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2)**2;
                        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                    }

                    const groups = [];
                    allResult.forEach(item => {
                        let findGroup = null;
                        for (let g of groups) {
                            const first = g[0];
                            const dist = calcDistance(first.lng, first.lat, item.lng, item.lat);
                            if ((first.name.includes(item.name) || item.name.includes(first.name)) && dist <= DIST_THRESHOLD_M) {
                                findGroup = g; break;
                            }
                        }
                        if (findGroup) findGroup.push(item);
                        else groups.push([item]);
                    });

                    const unique = groups.map(group => {
                        const poiItem = group.find(x => x.type === "poi");
                        return poiItem ? poiItem : group[0];
                    });

                    if (unique.length === 0) {
                        detailDom.innerText = "未找到位置，请输入更完整地址或先加载街道数据";
                        return;
                    }

                    detailDom.innerText = `共找到${unique.length}条结果，点击选择`;
                    unique.forEach((item, idx) => {
                        const div = document.createElement("div");
                        div.className = "result-item";
                        const tag = item.type === "poi" ? "【POI】" : "【地址】";
                        div.innerText = `${idx+1}.${tag}${item.name}`;
                        div.onclick = () => {
                            currentGeo = item;
                            map.setCenter([item.lng, item.lat]);
                            map.setZoom(16);
                            if (tempSelectMarker) tempSelectMarker.remove();
                            tempSelectMarker = new AMap.Marker({
                                position: [item.lng, item.lat],
                                icon: ICON_HIGHLIGHT,
                                map: map
                            });
                            detailDom.innerText =
                                `名称：${item.name}\n地址：${item.province||""}${item.city||""}${item.district||""}${item.street||""}\n经纬度：${item.lng.toFixed(4)},${item.lat.toFixed(4)}`;

                            const streetName = findStreetByLngLat(item.lng, item.lat);
                            if (streetName) {
                                setFilterStreet(streetName);
                            } else {
                                if (item.street && item.street.trim()) {
                                    const matched = Object.keys(streetCenterCache).find(
                                        s => s.includes(item.street) || item.street.includes(s)
                                    );
                                    if (matched) setFilterStreet(matched);
                                    else { clearFilter(); detailDom.innerText += '\n⚠️ 无法识别街道'; }
                                } else {
                                    clearFilter();
                                    detailDom.innerText += '\n⚠️ 无法识别街道';
                                }
                            }
                        };
                        listDom.appendChild(div);
                    });
                });
            });
        });
    }

    function setFilterStreet(streetName) {
        if (!streetName) { clearFilter(); return; }
        filterStreet = streetName;
        const bar = document.getElementById('streetIdentifyBar');
        bar.style.display = 'flex';
        document.getElementById('identifiedStreetName').textContent = streetName;
        const count = markerList.filter(m => (m.geo.street || '').trim() === streetName).length;
        document.getElementById('identifiedStreetCount').textContent = `（${count}）`;
        document.getElementById('filterInfo').innerHTML = `🔍 当前过滤：${streetName}（${count}）`;
        if (lastHighlightMarker) {
            lastHighlightMarker.setIcon(ICON_NORMAL);
            lastHighlightMarker = null;
        }
        document.getElementById('noteSearchResultBox').innerHTML = '';
        applyFilterAndRenderMap();
    }

    function clearFilter() {
        filterStreet = '';
        document.getElementById('filterInfo').innerHTML = '';
        document.getElementById('noteSearchResultBox').innerHTML = '';
        document.getElementById('streetIdentifyBar').style.display = 'none';
        document.getElementById('identifiedStreetName').textContent = '—';
        document.getElementById('identifiedStreetCount').textContent = '';
        if (lastHighlightMarker) {
            lastHighlightMarker.setIcon(ICON_NORMAL);
            lastHighlightMarker = null;
        }
        applyFilterAndRenderMap();
    }

    // ===== 备注搜索 =====
    function searchExistNoteMarker() {
        const keywordInput = document.getElementById("noteSearchInput").value.trim().toLowerCase();
        const boxDom = document.getElementById("noteSearchResultBox");
        if (!keywordInput) { boxDom.innerText = "请输入品类/师傅名"; return; }
        if (lastHighlightMarker) {
            lastHighlightMarker.setIcon(ICON_NORMAL);
            lastHighlightMarker = null;
        }
        const hitList = [];
        markerList.forEach((item, idx) => {
            if (filterStreet) {
                const itemStreet = (item.geo.street || '').trim();
                if (itemStreet !== filterStreet) return;
            }
            const nameStr = (item.geo.name || "").toLowerCase();
            const noteStr = (item.note || "").toLowerCase();
            const noteKeys = noteStr.split(/[,，、\s]+/).map(k => k.trim()).filter(k => k.length > 0);
            let isMatch = false;
            if (nameStr.includes(keywordInput)) isMatch = true;
            else {
                for (let nk of noteKeys) {
                    if (nk.includes(keywordInput) || keywordInput.includes(nk)) { isMatch = true; break; }
                }
            }
            if (isMatch) hitList.push({ idx, item });
        });
        if (hitList.length === 0) {
            const msg = filterStreet ?
                `在“${filterStreet}”下未找到匹配「${keywordInput}」` :
                `未找到匹配「${keywordInput}」`;
            boxDom.innerText = msg;
            return;
        }
        boxDom.innerHTML = `<div>共 ${hitList.length} 条，点击定位</div>`;
        hitList.forEach(hit => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerText = `[${hit.idx+1}] ${hit.item.geo.name} ｜ ${hit.item.note || "无"}`;
            div.dataset.index = hit.idx;
            div.onclick = function() {
                if (lastHighlightMarker) lastHighlightMarker.setIcon(ICON_NORMAL);
                hit.item.marker.setIcon(ICON_HIGHLIGHT);
                lastHighlightMarker = hit.item.marker;
                const pos = hit.item.marker.getPosition();
                map.setZoomAndCenter(16, pos);
                setTimeout(() => hit.item.infoWin.open(map, pos), 350);
            };
            boxDom.appendChild(div);
        });
    }

    // ===== Excel 导入 =====
    function handleExcelImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        pendingExcelData = null;
        document.getElementById('progressArea').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressBar').className = 'progress-bar';
        document.getElementById('progressText').textContent = '等待开始…';

        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const binary = ev.target.result;
                const workbook = XLSX.read(binary, { type: 'binary' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const jsonRows = XLSX.utils.sheet_to_json(sheet);
                if (!jsonRows || jsonRows.length === 0) {
                    alert('Excel为空');
                    e.target.value = '';
                    document.getElementById('fileStatusRow').style.display = 'none';
                    return;
                }
                pendingExcelData = jsonRows;
                document.getElementById('selectedFileName').textContent = `📄 ${file.name} (${jsonRows.length}行)`;
                document.getElementById('fileStatusRow').style.display = 'flex';
                document.getElementById('btnStartRecognize').disabled = false;
                document.getElementById('btnStartRecognize').textContent = '▶ 识别';
                document.getElementById('progressArea').style.display = 'none';
            } catch (err) {
                alert('解析Excel失败：' + err.message);
                e.target.value = '';
                document.getElementById('fileStatusRow').style.display = 'none';
            }
        };
        reader.readAsBinaryString(file);
    }

    function cancelPendingFile() {
        pendingExcelData = null;
        document.getElementById('fileStatusRow').style.display = 'none';
        document.getElementById('excelFileInput').value = '';
        document.getElementById('progressArea').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressBar').className = 'progress-bar';
        document.getElementById('progressText').textContent = '已取消';
    }

    async function startExcelRecognition() {
        if (isProcessing) {
            alert('正在处理中，请稍候…');
            return;
        }
        if (!pendingExcelData || pendingExcelData.length === 0) {
            alert('请先上传Excel文件');
            return;
        }
        if (Object.keys(streetCenterCache).length === 0) {
            alert('请先加载街道数据（点击侧边栏“街道”按钮），否则无法准确识别位置。');
            return;
        }

        const btn = document.getElementById('btnStartRecognize');
        btn.disabled = true;
        btn.textContent = '⏳ 处理中…';
        isProcessing = true;

        const progressArea = document.getElementById('progressArea');
        progressArea.style.display = 'block';
        const progressBar = document.getElementById('progressBar');
        progressBar.style.width = '0%';
        progressBar.className = 'progress-bar';
        const progressText = document.getElementById('progressText');

        try {
            const totalRows = pendingExcelData.length;
            progressText.textContent = `📊 共 ${totalRows} 行`;

            const result = await processExcelRowsWithProgress(pendingExcelData, (progress) => {
                const pct = Math.min(progress.percent || 0, 100);
                progressBar.style.width = pct + '%';
                let statusText = progress.status || '处理中…';
                let detail = '';
                if (progress.current !== undefined && progress.total !== undefined) {
                    detail = ` (${progress.current}/${progress.total})`;
                }
                if (progress.street) {
                    detail += ` 街道：${progress.street}`;
                }
                if (progress.count !== undefined) {
                    detail += ` 已生成 ${progress.count} 个`;
                }
                progressText.textContent = `${statusText}${detail}`;
                if (progress.done) {
                    progressBar.className = 'progress-bar done';
                    progressText.textContent = `✅ 完成！共 ${progress.count || 0} 个标记`;
                }
            });

            progressBar.style.width = '100%';
            progressBar.className = 'progress-bar done';
            progressText.textContent = `✅ 完成！共 ${result?.count || 0} 个标记`;
            updateMarkerCountBadge();
            alert(`✅ Excel 识别完成！共生成 ${result?.count || 0} 个标记`);

        } catch (err) {
            console.error('识别失败:', err);
            progressText.textContent = `❌ 失败：${err.message}`;
            alert('识别失败：' + err.message);
        } finally {
            isProcessing = false;
            btn.disabled = false;
            btn.textContent = '▶ 识别';
        }
    }

    async function processExcelRowsWithProgress(rows, onProgress) {
        if (!rows || rows.length === 0) {
            onProgress && onProgress({ status: '❌ 无数据', done: true, count: 0 });
            return { count: 0 };
        }

        function cleanStreetName(name) {
            if (!name) return '';
            name = name.trim();
            if (name.includes('街道') && !name.endsWith('街道')) name = name.replace(/街道/g, '').trim() + '街道';
            if (!name.endsWith('街道') && !name.includes('街道')) name = name + '街道';
            return name;
        }

        const groupMap = {};
        for (let row of rows) {
            let street = (row["街道"] || "").trim();
            const category = (row["品类"] || "").trim();
            if (!street || !category) continue;
            const rawStreet = street;
            street = cleanStreetName(street);

            const nameList = [];
            Object.keys(row).forEach(key => {
                if (key.startsWith("姓名")) {
                    const val = (row[key] || "").trim();
                    if (val) nameList.push(val);
                }
            });
            if (nameList.length === 0) continue;

            const groupKey = `${street}||${category}`;
            if (!groupMap[groupKey]) {
                groupMap[groupKey] = { street, rawStreet, category, nameList: [] };
            }
            nameList.forEach(name => {
                if (!groupMap[groupKey].nameList.includes(name)) groupMap[groupKey].nameList.push(name);
            });
        }

        const groupKeys = Object.keys(groupMap);
        if (groupKeys.length === 0) {
            onProgress && onProgress({ status: '⚠️ 没有有效分组', done: true, count: 0 });
            return { count: 0 };
        }

        onProgress && onProgress({
            status: `📦 分组完成，共 ${groupKeys.length} 组`,
            total: groupKeys.length,
            current: 0,
            percent: 0,
            count: 0
        });

        const unmatchedStreets = new Set();
        let geocodeSuccessCount = 0;
        const totalGroups = groupKeys.length;

        for (let i = 0; i < groupKeys.length; i++) {
            const gk = groupKeys[i];
            const gItem = groupMap[gk];
            const pct = Math.round((i / totalGroups) * 30);

            onProgress && onProgress({
                status: `🌐 坐标解析 ${i+1}/${totalGroups}`,
                total: totalGroups,
                current: i + 1,
                percent: pct,
                street: gItem.street,
                count: 0
            });

            if (streetCenterCache[gItem.street]) continue;
            const fuzzyKey = Object.keys(streetCenterCache).find(key =>
                key.includes(gItem.street.replace('街道', '')) || gItem.street.includes(key.replace('街道', ''))
            );
            if (fuzzyKey) {
                console.log(`✅ 模糊匹配：${gItem.street} → ${fuzzyKey}`);
                gItem.street = fuzzyKey;
                continue;
            }
            console.log(`🔍 地理编码：${gItem.street}`);
            const fullAddress = `西安市${gItem.street}`;
            const geo = await geocodeAmap(fullAddress);
            if (geo) {
                streetCenterCache[gItem.street] = { lng: geo.lng, lat: geo.lat };
                geocodeSuccessCount++;
            } else {
                unmatchedStreets.add(gItem.rawStreet || gItem.street);
            }
            await sleep(150);
        }

        if (unmatchedStreets.size > 0) {
            const toRemove = [];
            for (let gk of groupKeys) {
                const street = groupMap[gk].street;
                if (unmatchedStreets.has(street) || !streetCenterCache[street]) toRemove.push(gk);
            }
            toRemove.forEach(gk => delete groupMap[gk]);
            const msg = `⚠️ 以下 ${unmatchedStreets.size} 个街道无法获取坐标，已跳过：${[...unmatchedStreets].join('、')}`;
            onProgress && onProgress({
                status: msg,
                total: groupKeys.length,
                current: groupKeys.length,
                percent: 30,
                count: 0
            });
        }

        const validGroupKeys = Object.keys(groupMap);
        if (validGroupKeys.length === 0) {
            onProgress && onProgress({ status: '❌ 没有有效街道', done: true, count: 0 });
            return { count: 0 };
        }

        onProgress && onProgress({
            status: `✅ 坐标解析完成，有效 ${validGroupKeys.length} 组`,
            total: validGroupKeys.length,
            current: 0,
            percent: 30,
            count: 0
        });

        const streetTotalCount = {};
        for (let gk of validGroupKeys) {
            const street = groupMap[gk].street;
            streetTotalCount[street] = (streetTotalCount[street] || 0) + 1;
        }

        const streetOffsetCounter = {};
        let successCount = 0;
        const totalValid = validGroupKeys.length;

        for (let i = 0; i < validGroupKeys.length; i++) {
            const gk = validGroupKeys[i];
            const gItem = groupMap[gk];
            const street = gItem.street;
            const cat = gItem.category;
            const masterNames = gItem.nameList.join("，");

            const center = streetCenterCache[street];
            if (!center) continue;

            const total = streetTotalCount[street];
            const idx = streetOffsetCounter[street] || 0;
            streetOffsetCounter[street] = idx + 1;

            const angle = (idx / total) * 2 * Math.PI;
            const radius = 0.002 + Math.min(total * 0.0004, 0.0025);
            const lngOffset = radius * Math.cos(angle);
            const latOffset = radius * Math.sin(angle);

            const baseGeo = {
                name: `${street}｜${cat}`,
                address: street,
                lng: center.lng + lngOffset,
                lat: center.lat + latOffset,
                province: "陕西省",
                city: "西安市",
                district: "",
                street: street
            };
            const note = masterNames;
            const now = new Date().toISOString();

            const pct = 30 + Math.round((i / totalValid) * 70);
            onProgress && onProgress({
                status: `💾 保存 ${i+1}/${totalValid}`,
                total: totalValid,
                current: i + 1,
                percent: pct,
                street: street,
                count: successCount
            });

            try {
                const promise = supabaseClient.from(TABLE_NAME).insert([{
                    geo: baseGeo,
                    note: note,
                    created_at: now,
                    updated_at: now
                }]).select();
                const { data, error } = await supabaseFetchWithTimeout(() => promise);
                if (error) throw error;
                if (data && data.length > 0) {
                    const newDoc = data[0];
                    const item = createMarkerItem(newDoc.geo, newDoc.note, newDoc.id, newDoc.created_at, newDoc.updated_at);
                    markerList.push(item);
                    successCount++;
                }
            } catch (err) {
                console.error('导入标记失败：', err);
            }
            await sleep(30);
        }

        updateMarkerCountBadge();
        onProgress && onProgress({
            status: `✅ 完成`,
            done: true,
            count: successCount,
            percent: 100
        });

        return { count: successCount };
    }

    function geocodeAmap(address) {
        return new Promise(resolve => {
            AMap.plugin("AMap.Geocoder", () => {
                const geocoder = new AMap.Geocoder();
                geocoder.getLocation(address, function(status, res) {
                    if (status === "complete" && res.geocodes.length > 0) {
                        const g = res.geocodes[0];
                        resolve({ lng: g.location.lng, lat: g.location.lat });
                    } else resolve(null);
                });
            });
        });
    }

    // ===== Realtime 订阅 =====
    let subscription = null;
    function setupRealtimeSubscription() {
        if (subscription) { subscription.unsubscribe(); subscription = null; }
        subscription = supabaseClient
            .channel('public:markers')
            .on('postgres_changes', { event: '*', schema: 'public', table: TABLE_NAME }, payload => {
                console.log('🔄 数据库变更，重新加载数据', payload);
                loadFromCloud();
            })
            .subscribe((status) => { console.log('📡 Realtime 订阅状态:', status); });
    }

    // ===== 初始化 =====
    window.onload = function() {
        map = new AMap.Map("map", {
            zoom: 10,
            center: [108.85, 34.35],
            features: ['bg','road','point','building']
        });

        document.getElementById("excelFileInput").addEventListener("change", handleExcelImport);

        loadFromCloud().then(() => {
            setupRealtimeSubscription();
        });
    };
</script>
